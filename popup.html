<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fdfcfa;
        }
        .container {
            padding: 20px;
            background: #fdfcfa;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .status.loading {
            background: #f5f0e8;
            color: #8b7355;
            border: 1px solid #e8dcc8;
        }
        .status.error {
            background: #f5e8e0;
            color: #8b5a3a;
            border: 1px solid #e8c8b8;
        }
        .status.success {
            background: #eff5e8;
            color: #6b7355;
            border: 1px solid #d8e8c8;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .message {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #c9b89a;
            color: #3a2f25;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }
        .button:hover {
            background: #b8a788;
        }
        .button.secondary {
            background: #f5f0e8;
            color: #5a4a3a;
            border: 1px solid #e8dcc8;
        }
        .button.secondary:hover {
            background: #ebe4d8;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f5f0e8;
            border-top: 3px solid #c9b89a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
        .hint {
            font-size: 12px;
            line-height: 1.6;
            color: #8b7355;
            background: #f5f0e8;
            border: 1px solid #e8dcc8;
            border-radius: 6px;
            padding: 8px 10px;
            margin: -4px 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 載入中 -->
        <div id="loadingView" class="status loading">
            <div class="title">
                <span class="loading-spinner"></span>
                檢測中...
            </div>
            <div class="message">正在檢查 Native Host 安裝狀態</div>
        </div>

        <!-- 未安裝 - 引導安裝 -->
        <div id="installView" class="hidden">
            <div class="status error">
                <div class="title">❌ 需要完成安裝</div>
            </div>
            
            <div class="message" style="text-align: left; font-size: 13px; line-height: 1.8; margin-bottom: 15px;">
                <strong>安裝步驟：</strong><br>
                1. 沒裝過 LINE？先安裝到 Edge<br>
                2. 複製指令貼到終端機執行<br>
                3. 重新開啟此擴充功能即可使用
            </div>

            <button id="edgeLineBtn" class="button" style="background: #00B900;">安裝 LINE 到 Edge</button>
            <div class="hint">Edge 是 Windows 內建的瀏覽器（工作列上藍綠色圖示），跟 Chrome 不同。打開 Edge，把複製的網址貼到網址列即可。</div>
            <a href="#" id="downloadBtn" class="button">執行安裝腳本</a>
        </div>

        <!-- 已安裝 - 執行中 -->
        <div id="runningView" class="hidden">
            <div class="status success">
                <div class="title">
                    <span class="loading-spinner"></span>
                    正在開啟 LINE...
                </div>
                <div class="message">Edge 即將啟動並自動點擊 LINE</div>
            </div>
        </div>

        <!-- 錯誤 -->
        <div id="errorView" class="hidden">
            <div class="status error">
                <div class="title">❌ 發生錯誤</div>
                <div class="message" id="errorMessage"></div>
            </div>
            <button id="retryBtn" class="button">🔄 重試</button>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
