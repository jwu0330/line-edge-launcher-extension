<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
            background: #faf6ef;
            color: #3c342c;
            -webkit-font-smoothing: antialiased;
        }
        .container { padding: 20px; }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .status.loading {
            background: #f4ede2;
            color: #8a7c6b;
            border: 1px solid #eaded0;
        }
        .status.error {
            background: #f6ece3;
            color: #8a4a34;
            border: 1px solid #ecd9c8;
        }
        .status.success {
            background: #edf3e8;
            color: #5f7a52;
            border: 1px solid #d9e6cf;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .message {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #b0593f;
            color: #fff;
            border: 1px solid rgba(60,52,44,.12);
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            transition: background .12s;
        }
        .button:hover { background: #9a4c35; }
        .button.alt {
            background: #f4ede2;
            color: #6b5744;
            border: 1px solid #e0d0bd;
        }
        .button.alt:hover { background: #eee3d4; }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f4ede2;
            border-top: 3px solid #b0593f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
        .hint {
            font-size: 12px;
            line-height: 1.6;
            color: #8a7c6b;
            background: #f4ede2;
            border: 1px solid #eaded0;
            border-radius: 6px;
            padding: 8px 10px;
            margin: -4px 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 載入中 -->
        <div id="loadingView" class="status loading">
            <div class="title">
                <span class="loading-spinner"></span>
                檢測中...
            </div>
            <div class="message">正在檢查 Native Host 安裝狀態</div>
        </div>

        <!-- 未安裝 / 版本過舊 - 引導安裝 -->
        <div id="installView" class="hidden">
            <div class="status error">
                <div class="title" id="installTitle">需要完成安裝</div>
            </div>

            <div class="message" id="installMessage" style="text-align: left; font-size: 13px; line-height: 1.8; margin-bottom: 15px;">
                <strong>安裝步驟：</strong><br>
                1. 沒裝過 LINE？先安裝到 Edge<br>
                2. 複製指令貼到終端機執行<br>
                3. 重新開啟此擴充功能即可使用
            </div>

            <button id="edgeLineBtn" class="button alt">安裝 LINE 到 Edge</button>
            <div class="hint">Edge 是 Windows 內建的瀏覽器（工作列上藍綠色圖示），跟 Chrome 不同。打開 Edge，把複製的網址貼到網址列即可。</div>
            <a href="#" id="downloadBtn" class="button">執行安裝腳本</a>
        </div>

        <!-- 已安裝 - 執行中 -->
        <div id="runningView" class="hidden">
            <div class="status success">
                <div class="title">
                    <span class="loading-spinner"></span>
                    正在開啟 LINE...
                </div>
                <div class="message">Edge 即將啟動並自動點擊 LINE</div>
            </div>
        </div>

        <!-- 錯誤 -->
        <div id="errorView" class="hidden">
            <div class="status error">
                <div class="title">發生錯誤</div>
                <div class="message" id="errorMessage"></div>
            </div>
            <button id="retryBtn" class="button">重試</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
